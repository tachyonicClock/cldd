# Search settings for the pretrained ResNet-18. With 30 independent-TPE trials, gaps of
# 0.5-1.5 points between strategies were within tuning noise (each rerun failed a
# different strategy). Multivariate TPE models lr and strength jointly, and 60 trials
# with median pruning (from task 3 on) cost about 1.7x the old budget.
# An earlier lr floor of 1e-4 cut off LwF's best region and was dropped (runs kept
# under rcifar10_rn18_floor).
hpsearch:
  n_trials: 60
  multivariate: true
  constant_liar: true
  pruner: median
  pruner_warmup_steps: 2
  pruner_startup_trials: 10
