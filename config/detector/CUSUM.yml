drift_detector:
  type_: CUSUM
  error_stream_type: ERROR

hpsearch:
  args:
    "drift_detector.min_n_instances":
      type_: int
      low: 10
      high: 1000
      log: true
    "drift_detector.delta":
      type_: float
      low: 0.0001
      high: 0.01
      log: true
    "drift_detector.lambda_":
      type_: float
      low: 0.1
      high: 10
      log: true
